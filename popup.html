<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AltFlip Redirects</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .header {
      padding: 1.5rem;
      text-align: center;
    }
    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }
    .header p {
      font-size: 0.85rem;
      opacity: 0.9;
    }
    .content {
      background: white;
      color: #333;
      padding: 1rem;
      border-radius: 16px 16px 0 0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .toggle-row label {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .toggle {
      position: relative;
      width: 50px;
      height: 26px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .stat-card {
      background: #f8f9fa;
      padding: 0.75rem;
      border-radius: 8px;
      text-align: center;
    }
    .stat-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #667eea;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #666;
      margin-top: 0.25rem;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .services-list {
      margin: 1rem 0;
    }
    .service-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      font-size: 0.85rem;
      border-bottom: 1px solid #eee;
    }
    .service-item:last-child {
      border-bottom: none;
    }
    .service-name {
      font-weight: 500;
    }
    .service-instance {
      font-size: 0.75rem;
      color: #666;
    }
    .status {
      padding: 0.5rem;
      margin: 0.5rem 0;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ AltFlip</h1>
    <p>Privacy-friendly redirects</p>
  </div>
  
  <div class="content">
    <div class="toggle-row">
      <label for="enabled-toggle">Enable Redirects</label>
      <label class="toggle">
        <input type="checkbox" id="enabled-toggle" aria-label="Enable redirects toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="status" id="status">Saved!</div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="service-count"></div>
        <div class="stat-label">Services</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="instance-count"></div>
        <div class="stat-label">Instances</div>
      </div>
    </div>

    <button class="btn" id="options-btn">⚙️ Configure Instances</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
